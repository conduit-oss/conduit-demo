name: Conduit

on:
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/poetry.lock"
      - "**/Pipfile.lock"

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check NEBIUS_API_KEY
        id: secret
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          if [ -z "${NEBIUS_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when secret is missing
        if: steps.secret.outputs.present != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- conduit-hackathon-demo -->';
            const body = [
              marker,
              '## Conduit',
              '',
              'Missing repository secret `NEBIUS_API_KEY`.',
              '',
              'Add it under **Settings → Secrets and variables → Actions**, then re-run this workflow.',
              'Conduit will not merge; it only comments and (when the secret is set) pushes a verified fix commit to this branch.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Stop without secret
        if: steps.secret.outputs.present != 'true'
        run: echo "NEBIUS_API_KEY not set; exiting successfully."

      - name: Install Conduit and app deps
        if: steps.secret.outputs.present == 'true'
        run: |
          python -m pip install -U pip
          pip install "git+https://github.com/conduit-oss/conduit.git#subdirectory=conduit"
          pip install -r requirements.txt

      - name: Conduit impact + apply
        if: steps.secret.outputs.present == 'true'
        id: conduit
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          CONDUIT_APPLY_MODEL: nvidia/nemotron-3-super-120b-a12b
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1
          git show "origin/${BASE_REF}:requirements.txt" > /tmp/base-requirements.txt
          python - <<'PY'
          import json, os, pathlib, re, subprocess, sys

          pin_re = re.compile(r"(?mi)^\s*([A-Za-z0-9_.-]+)\s*==\s*([^\s#]+)")

          def pins(path: pathlib.Path) -> dict[str, tuple[str, str]]:
              out: dict[str, tuple[str, str]] = {}
              for m in pin_re.finditer(path.read_text(encoding="utf-8")):
                  out[m.group(1).lower()] = (m.group(1), m.group(2).strip())
              return out

          base = pins(pathlib.Path("/tmp/base-requirements.txt"))
          head = pins(pathlib.Path("requirements.txt"))
          changed = []
          for key, (name, to_ver) in head.items():
              if key == "pytest" or key not in base:
                  continue
              from_ver = base[key][1]
              if from_ver != to_ver:
                  changed.append((name, from_ver, to_ver))
          if not changed:
              sys.exit("No dependency pin changes vs base requirements.txt")

          merged = {
              "dependency": ",".join(n for n, _, _ in changed),
              "impacts": [],
              "deprecations": [],
              "diffed": [],
              "notes": [],
          }
          summaries = []
          for name, from_ver, to_ver in changed:
              summaries.append(f"{name} {from_ver}->{to_ver}")
              out = subprocess.check_output(
                  [
                      "conduit", "impact",
                      "--dep", name,
                      "--from", from_ver,
                      "--to", to_ver,
                      "--json",
                  ],
                  text=True,
              )
              payload = json.loads(out)
              merged["impacts"].extend(payload.get("impacts") or [])
              merged["deprecations"].extend(payload.get("deprecations") or [])
              merged["diffed"].extend(payload.get("diffed") or [])
              merged["notes"].extend(payload.get("notes") or [])

          merged["diffed"] = sorted(set(merged["diffed"]))
          pathlib.Path("impact.json").write_text(
              json.dumps(merged, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"dep_summary={'; '.join(summaries)}\n")
              fh.write(f"from_version={changed[0][1]}\n")
              fh.write(f"to_version={changed[0][2]}\n")

          # Prefer tests for modules named in impact sites so other demos
          # on main do not fail an unrelated apply verification.
          modules = sorted({
              pathlib.Path(site.get("path") or "").stem
              for item in merged.get("impacts") or []
              for site in (item.get("sites") or [])
              if site.get("path")
          })
          test_files = [
              f"test_{name}.py"
              for name in modules
              if name and pathlib.Path(f"test_{name}.py").is_file()
          ]
          test_cmd = (
              "python -m pytest -q " + " ".join(test_files)
              if test_files
              else "python -m pytest -q"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"test_cmd={test_cmd}\n")
          pathlib.Path("/tmp/conduit-test-cmd.txt").write_text(test_cmd + "\n", encoding="utf-8")
          PY
          TEST_CMD="$(cat /tmp/conduit-test-cmd.txt)"
          set +e
          conduit apply --impact impact.json --write --test-cmd "${TEST_CMD}" --json > apply.json
          echo "apply_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          git diff -- '*.py' > apply.diff || true

      - name: Comment impact, apply status, and diff
        if: steps.secret.outputs.present == 'true'
        uses: actions/github-script@v7
        env:
          DEP_SUMMARY: ${{ steps.conduit.outputs.dep_summary }}
          FROM_VERSION: ${{ steps.conduit.outputs.from_version }}
          TO_VERSION: ${{ steps.conduit.outputs.to_version }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- conduit-hackathon-demo -->';
            const depSummary = process.env.DEP_SUMMARY || '';
            const fromVersion = process.env.FROM_VERSION || '';
            const toVersion = process.env.TO_VERSION || '';

            function readJson(path) {
              try {
                return JSON.parse(fs.readFileSync(path, 'utf8'));
              } catch (e) {
                return null;
              }
            }

            const impact = readJson('impact.json') || {};
            const apply = readJson('apply.json') || {};
            let diff = '';
            try {
              diff = fs.readFileSync('apply.diff', 'utf8');
            } catch (e) {
              diff = '';
            }
            if (!diff.trim()) {
              const results = apply.results || [];
              diff = results.map(r => r.diff || '').filter(Boolean).join('\n\n');
            }

            const impactRows = [];
            for (const item of (impact.impacts || [])) {
              for (const site of (item.sites || [])) {
                impactRows.push(
                  `| \`${item.dependency}\` | ${item.from_version || ''} → ${item.to_version || toVersion} | ${site.path}:${site.line} | ${item.change || ''} | ${item.confidence || site.confidence || ''} |`
                );
              }
            }
            if (!impactRows.length) {
              impactRows.push('| _(none)_ | | | | |');
            }

            function shortWhy(text) {
              const raw = (text || '').replace(/\|/g, '\\|').trim();
              if (!raw) return '';
              const sentence = raw.split(/(?<=[.!?])\s+/)[0] || raw;
              return sentence.length > 120 ? sentence.slice(0, 117) + '...' : sentence;
            }
            const applyRows = [];
            for (const item of (apply.results || [])) {
              applyRows.push(
                `| ${item.path || ''}:${item.line || ''} | ${item.status || ''} | ${shortWhy(item.why || item.error || '')} |`
              );
            }
            if (!applyRows.length) {
              applyRows.push('| _(none)_ | | |');
            }

            const notes = (impact.notes || []).map(n => `- ${n}`).join('\n');
            const diffBlock = diff.trim()
              ? ('```diff\n' + diff.trim().slice(0, 60000) + '\n```')
              : '_No file diff produced._';

            const parts = [
              marker,
              '## Conduit',
              '',
              `Impact for \`${depSummary || (fromVersion + ' → ' + toVersion)}\`. Apply model: \`nvidia/nemotron-3-super-120b-a12b\`.`,
              '',
              '### Impact',
              '',
              '| Dependency | Versions | Site | Change | Confidence |',
              '| --- | --- | --- | --- | --- |',
              ...impactRows,
              '',
            ];
            if (notes) {
              parts.push('Notes:', notes, '');
            }
            parts.push(
              '### Apply status',
              '',
              '| Site | Status | Why |',
              '| --- | --- | --- |',
              ...applyRows,
              '',
              '### Diff',
              '',
              diffBlock,
              '',
              '_Conduit never merges. Verified fixes are pushed as a commit on this branch when tests pass._',
            );
            const body = parts.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Push verified fix to PR branch
        if: steps.secret.outputs.present == 'true'
        run: |
          git config user.name "conduit-bot"
          git config user.email "conduit-bot@users.noreply.github.com"
          # Stage tracked source edits from apply --write (never artifacts).
          git add -u -- .
          if git diff --cached --quiet; then
            echo "No verified fix to commit."
            exit 0
          fi
          git commit -m "fix: Conduit verified dependency migration"
          git push origin "HEAD:${{ github.head_ref }}"
